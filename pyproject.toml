[project]
name = "wiztype"
version = "0.1.13"
description = "A type dumper for wizard101"
readme = "README.md"
authors = [
    {name="StarrFox", email="starrfox6312@gmail.com"}
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "click>=8.2.1",
    "memobj==0.14.1",
    "iced-x86>=1.21.0"
]

[project.urls]
Repository = "https://github.com/StarrFox/wiztype"
Issues = "https://github.com/StarrFox/wiztype/issues"

[project.scripts]
wiztype = "wiztype.__main__:main"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
